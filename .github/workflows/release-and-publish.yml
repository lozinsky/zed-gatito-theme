name: Release and publish

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release type
        required: true
        default: minor
        type: choice
        options:
          - major
          - minor
          - patch

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump_extension.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Bump extension
        id: bump_extension
        env:
          RELEASE_TYPE: ${{ github.event.inputs.release_type }}
          NPM_CONFIG_REGISTRY: https://npm.jsr.io
        run: |
          bun run - <<'EOF'
          import * as toml from '@jsr/std__toml@1.0.11';
          import * as semver from '@jsr/std__semver@1.0.8';
          import fs from 'node:fs';

          const extension = toml.parse(await Bun.file('extension.toml').text());
          extension.version = semver.format(semver.increment(semver.parse(extension.version), process.env.RELEASE_TYPE));
          await Bun.write('extension.toml', toml.stringify(extension));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${extension.version}\n`);
          EOF

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add extension.toml
          git commit -m "chore: release v${{ steps.bump_extension.outputs.version }}"
          git tag "v${{ steps.bump_extension.outputs.version }}"
          git push origin HEAD --tags

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: v${{ steps.bump_extension.outputs.version }}
          tag_name: v${{ steps.bump_extension.outputs.version }}
          generate_release_notes: true

  publish:
    name: Publish
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Publish Zed extension
        uses: huacnlee/zed-extension-action@8cd592a0d24e1e41157740f1a529aeabddc88a1b # v2.0.0
        with:
          extension-name: gatito-theme
          tag: v${{ needs.release.outputs.version }}
          push-to: lozinsky/zed-extensions
        env:
          COMMITTER_TOKEN: ${{ secrets.COMMITTER_TOKEN }}
